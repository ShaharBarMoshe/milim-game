<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balloon Archer</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1b2a3a; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      /* A yellow crosshair with a black outline: easy to see on the bright sky and on the dark lava cave. */
      canvas { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><g fill='none' stroke-linecap='round'><circle cx='16' cy='16' r='9' stroke='black' stroke-width='5'/><path d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='black' stroke-width='5'/><circle cx='16' cy='16' r='9' stroke='%23ffe066' stroke-width='2.5'/><path d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='%23ffe066' stroke-width='2.5'/></g><circle cx='16' cy='16' r='2.5' fill='%23ff3b30' stroke='black'/></svg>") 16 16, crosshair; }

      /* Word-list overlay (HTML, not canvas, so Hebrew typing and RTL work natively). */
      .word-form {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; box-sizing: border-box;
        background: rgba(10, 25, 45, 0.55);
        font-family: 'Trebuchet MS', Arial, sans-serif; color: #fff;
      }
      .word-panel {
        width: min(640px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
        padding: 22px 26px; border: 3px solid #fff; border-radius: 16px;
        background: rgba(29, 53, 87, 0.95); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      .word-panel h1 { margin: 0 0 8px; font-size: 32px; color: #ffe066; text-shadow: 0 2px 0 #000; }
      .word-panel h1 span { font-size: 20px; color: #cfe8ff; text-shadow: none; unicode-bidi: isolate; }
      .word-help { margin: 6px 0; font-size: 15px; color: #cfe8ff; line-height: 1.4; }
      .word-help code { background: rgba(255, 255, 255, 0.15); padding: 0 5px; border-radius: 4px; unicode-bidi: isolate; }
      .word-form [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .list-bar, .list-head, .word-add { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
      .list-bar label { display: flex; flex: 1; align-items: center; gap: 8px; font-size: 16px; }
      .word-form input, .word-form select, .word-form button { font: 16px Arial, 'Noto Sans Hebrew', sans-serif; border-radius: 8px; box-sizing: border-box; }
      .word-form input, .word-form select { padding: 7px 10px; border: 2px solid #8fd3ff; background: #f7fbff; color: #102030; min-width: 0; }
      #list-select { flex: 1; }
      #list-name { flex: 1 1 220px; font-size: 20px; font-weight: bold; }
      .word-form input[readonly] { background: #dfe8f0; border-color: #9fb3c4; color: #445; }
      .word-form input:focus { outline: 3px solid #ffe066; outline-offset: 1px; }
      .word-form input[aria-invalid='true'] { border-color: #ff6b5a; }
      .word-form button { padding: 8px 16px; border: 0; cursor: pointer; color: #fff; font-weight: bold; }
      .word-form button:disabled { background: #6b7b8a; cursor: not-allowed; }
      .word-danger { background: #a33a3a; }
      .word-danger.armed { background: #e0322b; }
      .word-table-wrap { max-height: 260px; overflow-y: auto; border-radius: 10px; background: rgba(0, 0, 0, 0.2); }
      #word-table { width: 100%; border-collapse: collapse; }
      #word-table th { position: sticky; top: 0; background: #24456e; padding: 6px 8px; text-align: start; font-size: 14px; color: #cfe8ff; }
      #word-table td { padding: 3px 4px; }
      #word-table td:last-child { width: 40px; text-align: center; }
      #word-table input { width: 100%; padding: 5px 8px; }
      #word-empty { padding: 10px; margin: 0; }
      .pair-remove { background: transparent !important; color: #ffb4a8 !important; padding: 4px 8px !important; font-size: 18px !important; }
      .pair-remove:hover { color: #ff6b5a !important; }
      .word-add input { flex: 1 1 160px; }
      #word-error { min-height: 1.2em; font-size: 15px; }
      .word-summary { min-height: 1.4em; font-size: 15px; }
      #word-upload-status:empty { display: none; }
      .share-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: rgba(0, 0, 0, 0.25); font-size: 15px; }
      .share-panel[hidden] { display: none; }
      .share-link { padding: 8px 16px; border-radius: 8px; color: #fff; font-weight: bold; text-decoration: none; }
      #share-whatsapp { background: #1f9d55; }
      #share-email { background: #c0480e; }
      .share-link:focus-visible { outline: 3px solid #ffe066; outline-offset: 2px; }
      .word-form button[hidden] { display: none; }
      .word-ok { color: #a8ffb0; }
      .word-bad { color: #ffb4a8; }
      .word-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
      .word-controls label { display: flex; align-items: center; gap: 8px; font-size: 16px; margin-right: auto; }
      #word-start { background: #2e9e4f; font-size: 20px; padding: 10px 28px; }
      #word-start:disabled { background: #6b7b8a; }
      .word-secondary { background: #3a6ea5; }
      .word-form button:focus-visible, .word-form select:focus-visible, .word-form input:focus-visible { outline: 3px solid #ffe066; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
